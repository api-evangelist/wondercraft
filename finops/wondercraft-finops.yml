description: >-
  FinOps view of Wondercraft spend. Wondercraft bills via monthly or annual
  subscription plans that grant a credit allowance. Audio and video generation -
  including API-driven podcast, audio ad, meditation, and audiobook jobs - consume
  credits from the same plan balance. API access requires a paid plan (Creator,
  Pro, or Enterprise). Cost is managed by choosing a plan tier and monitoring
  credit burn rather than per-call invoicing.
notes: >-
  Credit-to-output ratios and add-on credit pack pricing are set on the
  Wondercraft pricing page and may change; verify during reconciliation.
