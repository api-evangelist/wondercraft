meters:
- name: subscription_plan
  description: Monthly or annual plan fee granting a credit allowance and API access on paid tiers.
  unit: plan
  aggregation: sum
  dimensions:
  - account
  - plan
- name: generation_credits
  description: Credits consumed by audio and video generation jobs, including API-driven podcast jobs.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - plan
- name: generation_jobs
  description: Count of audio generation jobs submitted via the API (subject to the 5 concurrent-job limit).
  unit: jobs
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track monthly credit balance and burn rate against generation volume in the Wondercraft account.
- name: Allocation
  description: Map API keys and projects to credit consumption to attribute spend to teams or workloads.
- name: Optimization
  description: Right-size the plan tier to actual credit usage; prefer scripted generation when AI scripting is not needed; respect the 5 concurrent-job limit to avoid wasted retries.
- name: Accountability
  description: Assign an owner for the Wondercraft subscription and review credit consumption before renewal.
