  humanURL: https://docs.wondercraft.ai/api-reference/endpoint/convo_mode_ai_scripted
  baseURL: https://api.wondercraft.ai/v1
  properties:
  - url: https://docs.wondercraft.ai/api-reference/endpoint/convo_mode_ai_scripted
    type: APIReference
  - url: https://docs.wondercraft.ai/api-reference/endpoint/convo_mode_user_scripted
    type: APIReference
  - url: openapi/wondercraft-openapi.yml
    type: OpenAPI
  - url: collections/wondercraft.postman_collection.json
    type: PostmanCollection
  - url: collections/wondercraft.opencollection.json
    type: OpenCollection
  description: Generates two-host conversational podcasts from either an AI prompt or a
    user-provided script, taking exactly two voice IDs plus optional delivery
