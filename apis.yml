  - url: openapi/wondercraft-openapi.yml
    type: OpenAPI
  - url: collections/wondercraft.postman_collection.json
    type: PostmanCollection
  - url: collections/wondercraft.opencollection.json
    type: OpenCollection
  description: Polls an audio generation job by job_id, returning whether it is finished,
    the generated script, the MP3 download URL, and any error details. Also lists a
    user's podcasts and verifies an API key.
