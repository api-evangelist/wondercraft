    type: OpenAPI
  - url: collections/wondercraft.postman_collection.json
    type: PostmanCollection
  - url: collections/wondercraft.opencollection.json
    type: OpenCollection
  description: Creates podcasts, audio ads, meditations, and audiobooks from a natural-language
    prompt using an AI-generated script. Optionally accepts platform voice IDs and a
    background music spec, and returns an asynchronous job_id.
- aid: wondercraft:scripted-audio-api
  name: Wondercraft Scripted Audio API
  tags:
