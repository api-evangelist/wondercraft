name: Wondercraft
kind: company
description: Wondercraft is an AI audio creation platform for producing podcasts, audio
  ads, meditations, and audiobooks. Its public REST API generates audio content from
  an AI-written or user-supplied script, supports a two-host Convo Mode, lets callers
  attach platform voices and background music by ID, and exposes asynchronous jobs
  that are polled for status and a finished MP3 download URL.
