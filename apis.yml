  - url: https://docs.wondercraft.ai/api-reference/endpoint/user_scripted
    type: APIReference
  - url: openapi/wondercraft-openapi.yml
    type: OpenAPI
  - url: collections/wondercraft.postman_collection.json
    type: PostmanCollection
  - url: collections/wondercraft.opencollection.json
    type: OpenCollection
  description: Generates audio from a user-provided script of ordered segments, each
    pairing text with a Wondercraft voice ID, with an optional background music track
